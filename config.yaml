llm:
  provider: groq
  model: openai/gpt-oss-120b
  fallback_model: openai/gpt-oss-20b
  temperature: 0.2
  max_tokens: 2048

analysis:
  weights:
    tfidf: 0.20
    keyword_coverage: 0.15
    skill_alignment: 0.30
    experience_alignment: 0.20
    education_alignment: 0.05
    explicit_skill_ratio: 0.10
  minimum_text_length: 20
  max_text_length: 50000
  keyword_top_k: 25

cache:
  enabled: true
  max_size: 100

ui:
  theme: dark
